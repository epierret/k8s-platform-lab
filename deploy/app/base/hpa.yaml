apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app
  labels:
    app.kubernetes.io/name: app
spec:
  scaleTargetRef:              # QUI je fais grandir ou rétrécir
    apiVersion: apps/v1
    kind: Deployment
    name: app
  minReplicas: 2               # jamais moins de 2 : un pod peut tomber sans coupure
  maxReplicas: 5               # plafond : protège le cluster (et la facture)
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70   # 70 % des REQUESTS CPU (50m → seuil ≈ 35m par pod)
