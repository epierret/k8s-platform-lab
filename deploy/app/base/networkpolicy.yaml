apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-default-deny
spec:
  # {} = s'applique à TOUS les pods du namespace
  podSelector: {}
  # on contrôle l'entrée ET la sortie → tout est fermé par défaut
  policyTypes: [Ingress, Egress]
  ingress:
    # badge d'entrée : seulement depuis les pods du même namespace, port 8080
    - from: [{podSelector: {}}]
      ports: [{protocol: TCP, port: 8080}]
  egress:
    # badge de sortie : seulement vers le DNS (l'annuaire du cluster)
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
