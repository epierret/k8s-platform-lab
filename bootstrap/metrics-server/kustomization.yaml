apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.1/components.yaml
patches:
  # kind UNIQUEMENT : ses kubelets ont des certificats auto-signés.
  # Ne jamais faire ça sur un vrai cluster. (k3s a déjà son metrics-server.)
  - target: {kind: Deployment, name: metrics-server, namespace: kube-system}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
